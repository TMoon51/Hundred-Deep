<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hundred Deep</title>

<style>
:root{--bg:#0e0c0a;--fg:#e9e1d3;--pn:#1b1713;--bd:#3b3229;--ac:#c8732a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
#app{height:100%;max-width:480px;margin:0 auto;position:relative}
#menu{height:100%;overflow:auto;padding:14px}#menu h1{margin:0 0 4px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.5px}#menu h3{font-family:Georgia,serif;color:#d9c7a7}#menu h3{margin:16px 0 4px}
#game{height:100%}
canvas{width:100%;height:100%;object-fit:contain;display:block;touch-action:none}
button{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;touch-action:manipulation}
button:disabled{opacity:.4}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin:6px 0}
small{color:#a3978a}.tabs{display:flex;gap:8px;margin:10px 0}.t{flex:1}.t.on{border-color:var(--ac);background:#2a2018}
.ri,.rel span,.dc .di{filter:grayscale(.55) sepia(.3) brightness(.78)}.rel{display:flex;gap:12px;align-items:center;text-align:left;width:100%;max-width:340px}.rel span{font-size:30px}
.go{width:100%;margin-top:14px;font-size:18px;padding:14px;background:linear-gradient(#6e2c17,#4a1c0e);border-color:#a0482a;font-weight:700;font-family:Georgia,serif;letter-spacing:.5px}

#menu{background:radial-gradient(ellipse at 50% -10%,#2e2015 0%,#14100c 45%,#0b0908 100%)}
.top{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.ttl{white-space:nowrap;display:flex;align-items:center;min-width:0;font:700 clamp(21px,7.4vw,30px) Georgia,serif;color:#e7d6b4;letter-spacing:.5px;text-shadow:0 2px 0 #000,0 0 18px rgba(200,115,42,.25)}
.tb button{padding:6px 10px;margin-left:6px}.tag{color:#9d8f7c;font:italic 14px Georgia,serif;margin:2px 0 12px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;background:linear-gradient(#211b15,#16120e)}
.cc .ce{width:38px;height:38px}.cc b{font-family:Georgia,serif}.cc small{font-size:11px;text-align:center;line-height:1.25}
.cc.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 0 14px rgba(200,115,42,.25);background:linear-gradient(#2c2117,#1a140f)}

.seg{display:flex;gap:6px;margin:16px 0 8px}.seg button{flex:1;padding:9px 4px;font-size:13px}.seg button.on{border-color:var(--ac);background:#2a2018;color:#f0dfbf}
.chain{position:relative;margin-left:14px;padding-left:18px;border-left:2px solid #3b3229}.node{position:relative}.node:before{content:'';position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:#3b3229;border:2px solid #0e0c0a}
.node.own:before{background:var(--ac)}.node.next:before{background:#e0b04a;box-shadow:0 0 8px #e0b04a}.node.lock{opacity:.55}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dc{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:flex-start}
.dc .di{font-size:28px;min-width:40px;text-align:center;line-height:40px}.dc img{width:40px;height:40px}.dc b{font-family:Georgia,serif;display:block}.dc small{line-height:1.3}.dc.unk{opacity:.5}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.sub button{padding:6px 10px;font-size:12px}.sub button.on{border-color:var(--ac)}
.sum{background:linear-gradient(#1d1712,#120e0b);border:1px solid #4a3c2e;border-radius:14px;padding:16px;max-width:330px;width:100%;box-shadow:0 10px 40px #000}
.sum h2{font:700 24px Georgia,serif;margin:0 0 4px;color:#e7d6b4}.sum .kb{color:#c98a6a;margin-bottom:10px}.ps,.sum{max-height:calc(100% - 16px);overflow-y:auto}.sh{font:600 12px Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:#b9a585;margin:12px 0 6px}.gl{display:flex;flex-wrap:wrap;gap:6px}.gi{display:inline-flex;align-items:center;gap:4px;background:#0f0c0a;border:1px solid #2d251e;border-radius:8px;padding:3px 7px 3px 3px;font-size:12px}.gi img{width:22px;height:22px}.gi b{color:#e7d6b4}.rls{display:flex;flex-direction:column;gap:5px}.rl{display:flex;gap:8px;align-items:center;background:#0f0c0a;border:1px solid #2d251e;border-radius:8px;padding:5px 8px;font-size:12px;text-align:left}.rl span{font-size:18px;filter:grayscale(.55) sepia(.3) brightness(.85)}.rl small{opacity:.75}
textarea{background:#0f0c0a;color:#e7d6b4;border:1px solid #3a2f25;border-radius:8px;padding:6px}
.snd{display:flex;gap:8px;margin:12px 0 4px}.snd button{flex:1;padding:8px 6px;font-size:13px}
.shg{text-align:center;color:#c9b6e4;font:600 16px Georgia,serif;margin:4px 0 2px}.shg.dim{color:#8a7d6c;font:12px system-ui}
.tti{width:1.1em;height:1.1em;margin-right:7px;flex:none}.bi{width:20px;height:20px;display:block}.rli{width:30px;height:30px;flex:none}img.di{width:34px;height:34px}
.ci{width:1.15em;height:1.15em;vertical-align:-.24em;margin-right:3px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.sg div{background:#0f0c0a;border:1px solid #2d251e;border-radius:10px;padding:8px}.sg b{display:block;font-size:20px;font-family:Georgia,serif;color:#e7d6b4}
#ov{position:absolute;inset:0;background:rgba(8,6,4,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
</style></head><body>
<div id="app"><div id="menu"></div>
<div id="game" hidden><canvas id="cv"></canvas><div id="ov" hidden></div></div></div>
<script>
const $d=s=>document.querySelector(s),cv=$d('#cv'),g=cv.getContext('2d'),W=360,H=520;cv.width=W;cv.height=H;
const CH=236,MT=240,FL=504,HOME=272,DOWN=460,BASEHP=70,RESTOCK=4,CAP=4940;
let S={gold:0,cls:'warrior',best:0,u:{},sh:0,desc:0,ab:null,pu:{},sf:1};
try{localStorage.removeItem('cc1')}catch(e){}
try{Object.assign(S,JSON.parse(localStorage.getItem('cc2')||'{}'))}catch(e){}
if(S.ab==null)S.ab=S.best;
// each class keeps its own gold, shards, shard upgrades, descents, best-this-descent and start floor
const PF=['gold','sh','psh','desc','ab','pu','sf','cb'],CLS=['warrior','rogue','mage'];
if(!S.cs){S.cs={};for(const c of CLS)S.cs[c]={gold:S.gold||0,sh:S.sh||0,desc:S.desc||0,ab:S.ab||0,pu:JSON.parse(JSON.stringify(S.pu||{})),sf:S.sf||1}}
function stash(){S.cs[S.cls]={};for(const f of PF)S.cs[S.cls][f]=S[f]}
function loadCls(){const d=S.cs[S.cls]||{};S.cb=d.cb||0;S.gold=d.gold||0;S.sh=d.sh||0;S.psh=d.psh||0;S.desc=d.desc||0;S.ab=d.ab||0;S.pu=JSON.parse(JSON.stringify(d.pu||{}));S.sf=d.sf||1}
S.dex=S.dex||{e:{},m:{},b:{},r:{},g:0};S.st=Object.assign({runs:0,wins:0,kills:0,bosses:0,gold:0,time:0,hit:0,killers:{},relics:{},cr:{},hist:[]},S.st||{});loadCls();
const saveStr=()=>{stash();S.at=Date.now();return JSON.stringify({cls:S.cls,best:S.best,u:S.u,cs:S.cs,mute:S.mute,nomus:S.nomus,dex:S.dex,st:S.st,run:S.run||null,red:S.red||{},bkr:S.bkr||0,at:S.at})};
// never let a stale copy of the game (another tab or window) overwrite a save that is further along; adopt it instead
let FORCESAVE=0;
const save=()=>{try{const old=localStorage.getItem('cc2');if(old&&!FORCESAVE){const o=JSON.parse(old);if(progOf(o)>progOf(S)+1){cloudApply(old);return}}localStorage.setItem('cc2',saveStr())}catch(e){}FORCESAVE=0;cloudSoon()};
// ---- cloud save: a private copy on the player's Claude account, so progress survives cleared storage and follows them across devices ----
let CLOUD=null,cloudT=0,cloudBusy=0,cloudDirty=0,CLOUDP=-1,CPEND=null,CLOUDOK=false;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1);
// installed web app (home screen) keeps its storage; so does any non-iPhone browser outside Claude
const isSA=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}},SAFE=()=>CLOUDOK||(!!window.WEBAPP&&(isSA()||!IOS));
// how far along a save is: total play time and runs only ever grow, so the save with more of them is the real one
const progOf=o=>{const t=(o&&o.st)||{};return (t.time||0)+(t.runs||0)*30+(t.kills||0)*.01};
function cloudApply(str){const c=JSON.parse(str);try{localStorage.setItem('cc2bak',saveStr())}catch(e){}for(const k of['cls','best','u','cs','mute','nomus','dex','st','run','red','bkr','at'])if(k in c)S[k]=c[k];loadCls();S.st=Object.assign({runs:0,wins:0,kills:0,bosses:0,gold:0,time:0,hit:0,killers:{},relics:{},cr:{},hist:[]},S.st||{});S.dex=S.dex||{e:{},m:{},b:{},r:{},g:0};try{localStorage.setItem('cc2',str)}catch(e){}CLOUDP=progOf(c);if(scr=='menu')menu()}
function cloudSoon(){if(!CLOUD||CPEND)return;cloudDirty=1;clearTimeout(cloudT);cloudT=setTimeout(cloudPush,4000)}
async function cloudPush(){if(!CLOUD||CPEND||cloudBusy||!cloudDirty)return;if(progOf(S)+1<CLOUDP)return;cloudBusy=1;cloudDirty=0;try{const str=saveStr();await CLOUD.set({cc2:str,at:S.at,prog:progOf(S)});CLOUDP=Math.max(CLOUDP,progOf(S));CLOUDOK=true}catch(e){if(e&&(e.code=='invalid_argument'||e.code=='revoked'||e.code=='not_granted'))CLOUD=null;else cloudDirty=1}cloudBusy=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(cloudT);cloudPush()}});window.addEventListener('pagehide',()=>{save();clearTimeout(cloudT);cloudPush()});
window.addEventListener('storage',e=>{if(e.key!='cc2'||!e.newValue)return;try{const o=JSON.parse(e.newValue);if(progOf(o)>progOf(S)+1)cloudApply(e.newValue)}catch(x){}});
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.doc('data/users/'+id+'/save'),snap=await ref.get();CLOUD=ref;const d=snap.exists?snap.data():null;
 let cp=-1;if(d&&typeof d.cc2=='string'){try{cp=progOf(JSON.parse(d.cc2))}catch(e){}}CLOUDP=cp;const lp=progOf(S);
 if(cp>lp||(cp==lp&&cp>=0&&(d.at||0)>(S.at||0))){if(scr=='game')CPEND=d.cc2;else cloudApply(d.cc2)}
 else if(lp>cp){cloudDirty=1;cloudPush()}}catch(e){CLOUD=null}})();
const CL={
warrior:{n:'Warrior',e:'🪓',h:1,dm:2.5,d:'Heavy claw with a tight, deep grip. It digs into the pile until it is full, taking whatever is closest to its middle first. Every axe you grab lands one crushing blow. Its Cleave skill adds sweeping items that hit every enemy.',sk:[['Cleave','Adds Cleave stones to the machine: a sweeping blow that hits every enemy for 70% of your base damage. More Damage levels, more items.'],['Iron Skin','Take 25% less damage'],['Bloodlust','Heal 5% HP on kill'],['Rubble Toss','Grabbed rocks are no longer junk: each one hits your target for 25% damage.'],['Execute','Axes deal x2 damage to enemies below 30% HP.'],['Last Stand','Once per run, a hit that would kill you leaves you at 1 HP instead.'],['Rage','Taking damage fills your Rage bar. When it is full, every axe in your next attack hits ALL enemies.'],['Brace','The first boss or mini-boss SLAM each floor deals 75% less damage.'],['Ground Slam','When your claw slams into the pile, a shockwave hits every enemy for 30% damage.']]},
rogue:{n:'Rogue',e:'🗡️',h:3,dm:.72,d:'A small claw and an iron hook. The claw grabs first, then the hook drops straight down and skewers the first 3 things its tip touches, however deep, rubble included. Then everything you grabbed attacks before the enemies strike. The Rogue hits lighter overall. Every dagger you grab lands 3 rapid strikes.',sk:[['Backstab','30% chance to crit for x2'],['Evasion','25% chance to dodge'],['Venom','Adds Venom vials to the machine. Each one poisons a random enemy for 120% of your base damage per stack, every round for 3 rounds, after your attacks and before the enemies strike. More Damage levels, more vials.'],['Pickpocket','Every crit heals 3% max HP.'],['Riposte','Every dodge counterattacks the attacker with one dagger strike.'],['Plague','When a poisoned enemy dies, its poison stacks jump to the next enemy, including reinforcements.'],['Mark','Tap an enemy in the fight to mark it. Your attacks focus it and it takes +25% damage.'],['Combo','Each turn the claw and the hook both get a dagger, Combo grows by 1 (max 5): +10% damage per stack. If either comes up without one, it resets.'],['Shadow Claw','Every 3rd turn, a shadow claw drops after the hook.']]},
mage:{n:'Mage',e:'🔮',h:2,dm:1.4,d:'A floating arcane orb that works like a magnet. It sinks into the pile and pulls in everything inside its ring, nearest first, and nothing slips. Every orb you grab casts 2 spells.',sk:[['Deep Freeze','Each spell has a 20% chance to freeze its target, so it loses its next attack. Bosses and the god resist.'],['Mana Shield','Take 25% less damage'],['Siphon','Heal 2.5% max HP per spell'],['Chain Lightning','Each spell has a 25% chance to arc to a second enemy for full damage.'],['Shatter','Frozen enemies take +50% damage.'],['Gravity Well','The orb pulls in Ember and Heartstone gems from well beyond its normal reach, and grabs them first.'],['Mana','Every spell adds 1 Mana. At 20, a Meteor hits every enemy for 300% damage.'],['Elemental Orbs','Adds fire orbs (hit every enemy for 120%) and ice orbs (a spell that always freezes) to the machine.'],['Recast','Once per turn, after your grab the orb drops again with a smaller pull.']]}};
const U=c=>{const u=S.u[c]||(S.u[c]={sz:0,dmg:0,hp:0,sk:0});if(u.sz==null){const o=u.spd||0,n=Math.min(SZMAX,o);for(let l=n;l<o;l++)S.gold+=cost(l);u.sz=n;delete u.spd}return u},SZMAX=10,CS=()=>1+.02*Math.min(SZMAX,U(S.cls).sz),cost=(l,gr=1.5)=>Math.ceil(15*Math.pow(gr,l)),GRO=k=>k=='sz'?1.5:1.6,SC=[60,250,900,3000,10000,30000,75000,200000,500000];
const P=k=>(S.pu&&S.pu[k])||0;
const PU=[['pdm','@sword Soul Might','+25% damage',5,1.6,0],['php','@hrt Soul Vigor','+25% max HP',5,1.6,0],['pg','@pouch Soul Greed','+25% gold from coins',5,1.6,0],['phv','@shard Soul Harvest','+15% Soul Shards from runs and Descend',25,1.9,10],['pgr','@claw Deep Grip','+8% grip capacity (Mage: a wider pull · Rogue: barbed hook)',15,2,5],['pst','@door Head Start','Start runs 10 floors deeper (pick your floor above)',20,1.8,9],['plb','@up Limit Break','+2 max level for Damage and Health',25,1.7,10]];
const LVCAP=()=>15+2*P('plb'),MAXLV=k=>k=='sz'?SZMAX:LVCAP();
const pcost=(p,l)=>Math.ceil(p[3]*Math.pow(p[4],l)),SHM=()=>1+.15*P('phv'),shards=()=>Math.floor(1.5*Math.pow(Math.max(0,S.ab-40),1.5)*SHM()),runShards=L=>L>40?Math.max(1,Math.floor(.15*1.5*Math.pow(L-40,1.5)*SHM())):0,maxSF=()=>1+10*P('pst');
const fmt=n=>n<1e4?Math.round(n):n<1e6?(n/1e3).toFixed(1)+'k':n<1e9?(n/1e6).toFixed(1)+'M':n.toExponential(1);
const TAG={warrior:'Heavy claw · one crushing blow per axe',rogue:'Claw and hook · three quick strikes per dagger',mage:'Magnet orb · two spells per orb'};
let TAB='up',DTAB='items';
function setTab(t){TAB=t;menu()}function setDTab(t){DTAB=t;menu()}
function menu(){const c=S.cls,u=U(c),b=CL[c];
const cards=CLS.map(k=>{const d=S.cs[k]||{};return`<button class="cc ${k==c?'on':''}" onclick="pick('${k}')"><img class="ce" src="${iconURL({warrior:'axe',rogue:'dagger',mage:'orbw'}[k])}" alt=""><b>${CL[k].n}</b><small>${TAG[k]}</small><small style="color:#cdbb99">Best ${k==c?S.cb:(d.cb||0)}</small></button>`}).join('');
const sf=Math.min(S.sf||1,maxSF()),floors=[];for(let f=1;f<=maxSF();f+=10)floors.push(f);
const start=P('pst')?`<div class="sub" style="justify-content:center">${floors.map(f=>`<button class="${f==sf?'on':''}" onclick="pickSF(${f})">Floor ${f}</button>`).join('')}</div>`:'';
let pane='';
if(TAB=='up'){pane=[['sz','@claw Claw size','+2% claw size per level: wider reach and a bigger grip'],['dmg','@burst Damage','+15% damage per level'],['hp','@hrt Health','+15% max HP per level']].map(([k,n,d])=>{const co=cost(u[k],GRO(k)),mx=u[k]>=MAXLV(k);return`<div class="r"><div><b>${TI(n)}</b> Lv ${u[k]}/${MAXLV(k)}<br><small>${d}</small></div>${mx?'<small>MAX</small>':`<button ${S.gold<co?'disabled':''} onclick="up('${k}')">${CI()}${fmt(co)}</button>`}</div>`}).join('')}
else if(TAB=='sk'){pane='<div class="chain">'+b.sk.map((x,i)=>{const own=u.sk>i,nx=u.sk==i;return`<div class="node ${own?'own':nx?'next':'lock'}"><div class="r"><div><b>${x[0]}</b> ${own?IC('check'):''}<br><small>${x[1]}</small></div>${own?'':`<button ${(!nx||S.gold<SC[i])?'disabled':''} onclick="sk(${i})">${CI()}${fmt(SC[i])}</button>`}</div></div>`}).join('')+'</div>'}
else if(TAB=='soul'){const gain=shards();pane=`<div class="r"><div><b>${IC('down')}Descend</b><br><small>${S.ab>=50?`Reset this ${b.n}'s gold, upgrades and skill tree and release <b style="color:#e7d6b4">${IC('shard')}${gain+(S.psh||0)} Soul Shards</b>: the ${fmt(S.psh||0)} sealed from your runs plus a ${gain} bonus for your best floor this descent.`:`Reach floor 50 to unlock. Best this descent: ${S.ab}.`}<br><span style="opacity:.8">Every run that gets past floor 40 seals Soul Shards into this class, deeper runs sealing more. Sealed shards can't be spent until you Descend.${S.psh&&S.ab<50?` Sealed so far: ${IC('shard')}${fmt(S.psh)}.`:''}</span></small></div><button ${S.ab>=50?'':'disabled'} onclick="descend()">${S.dc?'Tap again':'Descend'}</button></div>`+
 `<h3>${IC('shard')}${b.n} Soul Shards: ${fmt(S.sh)}${S.psh?` <small style="opacity:.75;font-weight:400">· ${fmt(S.psh)} sealed until you Descend</small>`:''}</h3>`+PU.map(p=>{const l=P(p[0]),mx=p[5]&&l>=p[5],co=pcost(p,l);return`<div class="r"><div><b>${TI(p[1])}</b> Lv ${l}${p[5]?'/'+p[5]:''}<br><small>${p[0]=='pgr'&&S.cls=='rogue'?`+8% claw grip, and the hook grows barbs: each item it skewers has a ${15*(l+1)}% chance to drag up a piece of loot touching it${l?` (now ${15*l}%)`:''}`:p[2]}</small></div>${mx?'<small>MAX</small>':`<button ${S.sh<co?'disabled':''} onclick="pup('${p[0]}')">${IC('shard')}${fmt(co)}</button>`}</div>`}).join('')}
else if(TAB=='dex')pane=dexPane();else pane=statsPane();
$d('#menu').innerHTML=`<div class="top"><div class="ttl">${IC('chain','tti')}Hundred Deep</div><div class="tb"><button style="${S.nomus||S.mute?'opacity:.45':''}" onclick="toggleMusic()">${IC('music','bi')}</button><button onclick="toggleMute()">${IC(S.mute?'mute':'sound','bi')}</button></div></div>
<div class="tag">Descend. Grab. Survive. Something waits at the bottom.</div>
<div class="cls">${cards}</div>
${typeof installHint=='function'?installHint():''}${!SAFE()&&IOS&&!window.WEBAPP&&S.st.runs-(S.bkr||0)>=3?`<button style="width:100%;margin:2px 0 8px;font-size:13px;border-color:#7a5a2a" onclick="bkCopy()">${BK.copied?'Backup code copied. Keep it somewhere safe':'Your progress on this iPhone is only on this device. Tap to copy a backup code'}</button>`:''}<div class="stat"><span>${CI()}<b>${fmt(S.gold)}</b></span><span>${IC('shard')}<b>${fmt(S.sh)}</b>${S.psh?` <small style="opacity:.75">+${fmt(S.psh)} sealed</small>`:''}</span><span>Descents ${S.desc}</span><span>This descent: floor ${S.ab}</span></div>
${S.run?`<button class="go" onclick="cont()">Continue · ${CL[S.run.cls].n} · floor ${S.run.L}</button>`:''}${start}<button class="${S.run?'':'go'}" style="${S.run?'width:100%;margin-top:10px':''}" onclick="newRun()">${S.run?(S.nr?'Tap again to abandon the saved run':'New run'):'Enter the dungeon'}${sf>1?' · floor '+sf:''}</button>

// painted claws: housing + hinged talons (or blades), assembled per open state
const CPI={};for(const k in CLAWP){const im=new Image();im.src=CLAWP[k].src;CPI[k]=im}
const cpReady=()=>Object.values(CPI).every(i=>i.complete&&i.naturalWidth);
function cpart(x,n,px,py,rot,sx,sy,mir,al){const d=CLAWP[n];x.save();x.translate(px,py);if(mir)x.scale(-1,1);x.rotate(rot);x.scale(sx,sy);if(al!=null)x.globalAlpha=al;x.drawImage(CPI[n],-d.px/3,-d.py/3,d.w/3,d.h/3);x.restore()}
function clawSpr(kind,op,col,ghost){if(!cpReady())return clawSprOld(kind,op,col,ghost);const q=Math.round(op*8)/8,key='p'+kind+q+(col||'')+(ghost?1:0);if(CSPR[key])return CSPR[key];
const c=document.createElement('canvas');c.width=420;c.height=330;const x=c.getContext('2d');x.scale(3,3);x.translate(70,26);
if(kind=='h'){const t=(q-.5)*.6;for(const s of[-1,1])cpart(x,'talon',s*3.9,6,t,.62,.84,s>0,.6);for(const s of[-1,1])cpart(x,'talon',s*7,6,t,1,1,s>0);cpart(x,'hub',0,0,0,1,1)}
else{const t=(q-.5)*.5;for(const s of[-1,1])cpart(x,'blade',s*5,3,t,1,1,s>0);cpart(x,'bhub',0,0,0,1,1);if(col&&!ghost){x.globalAlpha=.85;x.fillStyle=col;x.fillRect(-17,-2,34,3);x.globalAlpha=1}}

const WIMG={};for(const k in WEAPPAINT){WIMG[k]=new Image();WIMG[k].src=WEAPPAINT[k].src}
const WVAR={};
// tinted copies: shadow-dark daggers, ember-edged axe, frosted hands
function wvar(n,kind){const key=n+kind;if(WVAR[key])return WVAR[key];const d=WEAPPAINT[n],im=WIMG[n];if(!im.complete||!im.naturalWidth)return im;
const c=document.createElement('canvas');c.width=d.w;c.height=d.h;const x=c.getContext('2d');x.drawImage(im,0,0);x.globalCompositeOperation='source-atop';
if(kind=='dark'){x.fillStyle='rgba(16,11,20,.74)';x.fillRect(0,0,d.w,d.h)}
else if(kind=='rage'){const gr=x.createLinearGradient(d.w,0,d.w-34,0);gr.addColorStop(0,'rgba(128,36,12,.5)');gr.addColorStop(.45,'rgba(110,30,10,.3)');gr.addColorStop(1,'rgba(110,30,10,0)');x.fillStyle=gr;x.fillRect(0,0,d.w,d.py*.55)}
else if(kind=='ice'){const gr=x.createLinearGradient(0,0,0,d.h);gr.addColorStop(0,'rgba(170,200,218,.5)');gr.addColorStop(.55,'rgba(156,190,212,.26)');gr.addColorStop(.75,'rgba(160,196,218,0)');x.fillStyle=gr;x.fillRect(0,0,d.w,d.h)}
return WVAR[key]=c}
function wdraw(n,x,y,rot,s,fl,img,al,sy){const d=WEAPPAINT[n];g.save();g.translate(x,y);g.rotate(rot);g.scale(fl?-s:s,s*(sy||1));if(al!=null)g.globalAlpha=al;g.drawImage(img||WIMG[n],-d.px,-d.py,d.w,d.h);g.restore()}
